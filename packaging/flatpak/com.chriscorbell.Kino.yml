# Kino for Linux. The KDE runtime and the Qt WebEngine base app match the Qt
# release the macOS build uses. libmpv and its FFmpeg are built here rather
# than taken from the runtime, so hardware decoding through VA-API is present.
# The source pins follow Flathub's io.mpv.Mpv manifest.
id: com.chriscorbell.Kino
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: Kino
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Media keys and desktop controls.
  - --own-name=org.mpris.MediaPlayer2.kino
  - --own-name=org.mpris.MediaPlayer2.kino.*
  # The screensaver fallback when the desktop has no idle-inhibit portal.
  - --talk-name=org.freedesktop.ScreenSaver
  # Pausing before sleep.
  - --system-talk-name=org.freedesktop.login1
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: libass
    config-opts:
      - --disable-static
      - --enable-asm
      - --enable-harfbuzz
      - --enable-fontconfig
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d

  # Decoders only. The native ones cover H.264, HEVC, VP9 and the audio
  # formats Kino plays; dav1d covers AV1, and VA-API the hardware path.
  - name: ffmpeg
    config-opts:
      - --disable-debug
      - --disable-doc
      - --disable-programs
      - --disable-static
      - --enable-shared
      - --enable-gpl
      - --enable-version3
      - --enable-gnutls
      - --enable-libdav1d
      - --enable-libdrm
      - --enable-vaapi
    cleanup:
      - /share/ffmpeg
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n9.0.1
        commit: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dopengl=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  # mpv's X11 support, which VA-API over an X11 display needs, presents
  # through the Present extension.
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa

  # mpv's DRM support, which VA-API reaches the GPU's render node through,
  # reads monitor data with libdisplay-info.
  - name: hwdata
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.394.tar.gz
        sha256: b7c3fd7214a3b7c49d2661db127a712dc11cffd1799f793947aa1cb20aaf3298

  - name: libdisplay-info
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.2.0/libdisplay-info-0.2.0.tar.gz
        sha256: f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Drubberband=disabled
      - -Dvapoursynth=disabled
      - -Dvulkan=disabled
      - -Duchardet=enabled
      - -Dlcms2=enabled
      - -Dgl=enabled
      - -Degl=enabled
      - -Degl-wayland=enabled
      - -Degl-x11=enabled
      - -Dwayland=enabled
      - -Dx11=enabled
      - -Ddrm=enabled
      - -Dgbm=enabled
      - -Dvaapi=enabled
      - -Dvaapi-drm=enabled
      - -Dvaapi-wayland=enabled
      - -Dvaapi-x11=enabled
      - -Dpulse=enabled
      - -Dpipewire=enabled
      - -Dalsa=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  # The torrent engine: stream-server at the revision engine.lock pins, with
  # Kino's patches, over libtorrent and Boost at the releases the Android
  # build pins. Build-time only; the engine links them statically.
  - name: boost-headers
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/include && cp -r boost ${FLATPAK_DEST}/include/
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-b2-nodocs.tar.xz
        sha256: ea7b982002cc9dfbe59b0b217b206f470dc75f3de0bb2973d844118934d82411

  - name: libtorrent
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_CXX_STANDARD=17
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -Dwebtorrent=OFF
      - -Dbuild_tests=OFF
      - -Dbuild_examples=OFF
      - -Dbuild_tools=OFF
      - -Dpython-bindings=OFF
      - -DBoost_INCLUDE_DIR=/app/include
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/arvidn/libtorrent/releases/download/v2.1.2/libtorrent-rasterbar-2.1.2.tar.gz
        sha256: 3362546d9cd71b9e49ee6cac7d3f1f914ce9cdb217c86b63d5b22cbed0334dbc

  # Cargo fetches the locked crates, so this module builds with network
  # access, which a Flathub build would not have.
  - name: kino-stream-engine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/kino-stream-engine/cargo
        CXXFLAGS: -I/app/include
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
        LIBTORRENT_STATIC: '1'
        PKG_CONFIG_PATH: /app/lib/pkgconfig
    build-commands:
      - cargo build --locked --release --manifest-path apps/stream-engine/Cargo.toml
      - install -Dm755 apps/stream-engine/target/release/kino-stream-engine ${FLATPAK_DEST}/bin/kino-stream-engine
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - node_modules
          - apps/android-tv
          - apps/desktop
          - mockup
      - type: git
        url: https://github.com/stremio-native/stream-server.git
        commit: f585ab6eda9b1411034548c131bb0dc30c6f5f9e
        dest: build/vendor/stream-server
      - type: patch
        use-git: true
        dest: build/vendor/stream-server
        paths:
          - ../../apps/stream-engine/patches/0001-decode-info-hash-without-internal-libtorrent-symbols.patch
          - ../../apps/stream-engine/patches/0002-exclude-youtube-tools.patch
          - ../../apps/stream-engine/patches/0003-allow-embedded-router-ownership.patch
          - ../../apps/stream-engine/patches/0004-retain-torrent-web-seeds.patch
          - ../../apps/stream-engine/patches/0005-keep-the-engine-off-router-port-mapping-and-lan-discovery.patch
          - ../../apps/stream-engine/patches/0006-give-the-engine-its-roots-on-android.patch
          - ../../apps/stream-engine/patches/0007-leave-archive-readers-out-of-android.patch

  # The shell. CI builds the web interface first, since the sandbox has no
  # network for pnpm; node is still needed for the locale the shell embeds.
  - name: kino
    buildsystem: cmake-ninja
    subdir: apps/macos-shell
    build-options:
      append-path: /usr/lib/sdk/node24/bin
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DKINO_BUILD_WEB_UI=OFF
    post-install:
      - install -Dm644 /run/build/kino/packaging/flatpak/com.chriscorbell.Kino.desktop ${FLATPAK_DEST}/share/applications/com.chriscorbell.Kino.desktop
      - install -Dm644 /run/build/kino/packaging/flatpak/com.chriscorbell.Kino.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.chriscorbell.Kino.png
      - install -Dm644 /run/build/kino/packaging/flatpak/com.chriscorbell.Kino.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.chriscorbell.Kino.metainfo.xml
      - sed -i -e "s/@KINO_VERSION@/$(node -p "require('/run/build/kino/package.json').version")/"
        -e "s/@KINO_DATE@/$(date -u +%F)/" ${FLATPAK_DEST}/share/metainfo/com.chriscorbell.Kino.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - node_modules
          - apps/android-tv
          - mockup
