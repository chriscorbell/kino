name: Linux Flatpak

on:
  pull_request:
    paths:
      - .github/workflows/flatpak.yml
      - packaging/flatpak/**
      - apps/macos-shell/**
      - apps/desktop/**
      - apps/stream-engine/**
      - package.json
      - pnpm-lock.yaml
      - scripts/build-engine.sh
      - scripts/check-engine-profile.mjs
      - scripts/license-notices.mjs
      - scripts/linux-notices.mjs
      - third_party/notices/**
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine the Flatpak ships, built natively from the manifest's pins,
  # since the Flatpak build runs no tests: its unit tests and the embedded
  # profile check run on Linux as they do on macOS and Windows.
  engine:
    name: Linux engine build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KINO_DEPS: ${{ github.workspace }}/build/linux-engine-deps
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/engine-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build pkg-config libssl-dev libclang-dev lsof >/dev/null
      - name: Restore libtorrent and Boost
        id: deps-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/linux-engine-deps
          key: linux-engine-deps-${{ hashFiles('packaging/flatpak/com.chriscorbell.Kino.yml') }}
      # The Boost and libtorrent releases the manifest pins, read from it so
      # the two cannot drift apart.
      - name: Build libtorrent over Boost's headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          manifest=packaging/flatpak/com.chriscorbell.Kino.yml
          pinned() { sed -n "/^  - name: $1\$/,/^  - name:/p" "$manifest" | sed -n "s/^ *$2: //p" | head -1; }
          mkdir -p build/linux-engine-src "$KINO_DEPS/include"
          cd build/linux-engine-src
          curl -fsSL -o boost.tar.xz "$(pinned boost-headers url)"
          echo "$(pinned boost-headers sha256)  boost.tar.xz" | sha256sum -c -
          tar -xf boost.tar.xz && cp -r boost-*/boost "$KINO_DEPS/include/"
          curl -fsSL -o libtorrent.tar.gz "$(pinned libtorrent url)"
          echo "$(pinned libtorrent sha256)  libtorrent.tar.gz" | sha256sum -c -
          tar -xf libtorrent.tar.gz
          cmake -S libtorrent-rasterbar-* -B libtorrent -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_CXX_STANDARD=17 -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -Dwebtorrent=OFF -Dbuild_tests=OFF -Dbuild_examples=OFF -Dbuild_tools=OFF \
            -Dpython-bindings=OFF -DBoost_INCLUDE_DIR="$KINO_DEPS/include" \
            -DCMAKE_INSTALL_PREFIX="$KINO_DEPS" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build libtorrent --parallel "$(nproc)"
          cmake --install libtorrent
      - name: Save libtorrent and Boost
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/linux-engine-deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: Build the engine
        env:
          CXXFLAGS: -I${{ github.workspace }}/build/linux-engine-deps/include
          LIBTORRENT_STATIC: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/linux-engine-deps/lib/pkgconfig
        run: |
          bash scripts/build-engine.sh --vendor-only
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' apps/stream-engine/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup run "$channel" cargo build --locked --release --manifest-path apps/stream-engine/Cargo.toml
      - name: Check the engine
        timeout-minutes: 10
        env:
          CXXFLAGS: -I${{ github.workspace }}/build/linux-engine-deps/include
          LIBTORRENT_STATIC: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/build/linux-engine-deps/lib/pkgconfig
          KINO_ENGINE_BINARY: ${{ github.workspace }}/build/engine-target/release/kino-stream-engine
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' apps/stream-engine/rust-toolchain.toml)
          (cd apps/stream-engine && rustup run "$channel" cargo test --locked --release)
          pnpm engine:check-profile

  # The build sandbox has neither the npm packages nor the crates, so the
  # license notices are collected here and handed to the build.
  notices:
    name: Collect the Linux notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vendor the patched stream-server and fetch its crates
        run: |
          bash scripts/build-engine.sh --vendor-only
          cargo fetch --locked --manifest-path apps/stream-engine/Cargo.toml
      - run: node scripts/linux-notices.mjs generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-notices
          path: build/linux-notices
          retention-days: 7

  flatpak:
    name: Build the Flatpak
    needs: notices
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Flatpak sandbox has no network, so the web interface is built here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kino/desktop build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-notices
          path: build/linux-notices
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/com.chriscorbell.Kino.yml
          bundle: Kino.flatpak
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/com.chriscorbell.Kino.yml') }}
          upload-artifact: true
      - name: Install the bundle
        run: |
          flatpak install --user -y --noninteractive Kino.flatpak
          # Mesa's GL for the runtime, which a desktop installs with it.
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.GL.default//25.08
      # What people install, read back: every native file in /app belongs to a
      # reviewed component, and the notices page carries every text.
      - name: Verify the installed notices
        run: node scripts/linux-notices.mjs verify "$(flatpak info --user --show-location com.chriscorbell.Kino)/files"
      # The packaged app must start and load the interface it carries, on a
      # virtual display, with its own instance name so nothing else answers.
      # The container runs as root, where Chromium will not start with its
      # sandbox, so this run alone turns it off.
      - name: Start the packaged app
        run: |
          log=$(mktemp)
          # This image's Xvfb has no GLX, which Chromium's GPU process needs;
          # Qt itself draws through Mesa's EGL, and Chromium draws in software.
          timeout 60 xvfb-run -a -s "-screen 0 1920x1080x24" flatpak run --user --env=KINO_INSTANCE_NAME=ci-smoke \
            --env=QTWEBENGINE_DISABLE_SANDBOX=1 --env=QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu \
            com.chriscorbell.Kino >"$log" 2>&1 &
          for _ in $(seq 1 45); do
            grep -q "packaged UI loaded" "$log" && break
            sleep 1
          done
          if ! grep -q "packaged UI loaded" "$log"; then
            sed -n '1,120p' "$log"
            echo "The Flatpak did not load its packaged interface."
            exit 1
          fi
          grep -E "native shell started|packaged UI loaded" "$log"
          # A second launch, a sandbox of its own, finds the first and exits.
          second=$(mktemp)
          timeout 30 xvfb-run -a flatpak run --user --env=KINO_INSTANCE_NAME=ci-smoke \
            com.chriscorbell.Kino >"$second" 2>&1 || true
          for _ in $(seq 1 10); do
            grep -q "brought forward by a second launch" "$log" && break
            sleep 1
          done
          if ! grep -q "asked it to come forward" "$second" || ! grep -q "brought forward by a second launch" "$log"; then
            sed -n '1,40p' "$second"
            echo "A second launch did not reach the running Flatpak."
            exit 1
          fi
          pkill -f com.chriscorbell.Kino || true
