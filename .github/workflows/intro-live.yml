name: TheIntroDB

# The intro client against the live service, apart from CI so that an outage of the service never
# blocks a merge. Weekly catches a change on the service's side; the paths catch one on Kino's.
on:
  pull_request:
    paths:
      - .github/workflows/intro-live.yml
      - scripts/check-intro-live.mjs
      - apps/desktop/package.json
      - apps/desktop/src/intro/markers.ts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .node-version
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intro-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Live intro check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @kino/desktop
      - run: pnpm intro:check-live
