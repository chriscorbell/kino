name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
      packaging: ${{ steps.paths.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        name: Check native build inputs
        env:
          KINO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          KINO_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node <<'JS'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const { KINO_BASE: base, KINO_HEAD: head } = process.env;
          const files = !base || /^0+$/.test(base)
            ? ['.github/workflows/ci.yml']
            : execFileSync('git', ['diff', '--name-only', '-z', base, head], { encoding: 'utf8' }).split('\0');
          // Inputs to the native build, its tests, and its startup probes. A
          // change anywhere else, including the Android workflow and its
          // scripts, leaves the macOS job skipped.
          // The probes build the production interface and drive it screen by
          // screen, so every client source counts; only its unit tests do not.
          const nativePaths = /^(\.github\/workflows\/ci\.yml$|apps\/(macos-shell|stream-engine)\/|apps\/desktop\/(index\.html$|vite\.config\.ts$|package\.json$|src\/(?!.*\.test\.tsx?$))|scripts\/(build-engine\.sh|build-macos\.sh|check-engine-|check-macos-|check-intro-community\.mjs$|test-support\/|package-macos\.mjs$)|third_party\/|package\.json$|pnpm-lock\.yaml$|\.node-version$)/;
          // Inputs to the packaged bundle and the notices it carries. On a pull
          // request the packaging step runs only for these; every push to main
          // packages regardless, so a release artifact is never first built at
          // tag time. The notice index itself is checked on every pull request
          // by "pnpm notices:check" in the web job.
          const packagingPaths = /^(\.github\/workflows\/ci\.yml$|apps\/macos-shell\/CMakeLists\.txt$|scripts\/(package-macos\.mjs|check-license-notices\.mjs)$|third_party\/|pnpm-lock\.yaml$)/;
          const packaging = files.some((file) => packagingPaths.test(file));
          // Packaging runs inside the native job, so anything that packaging
          // depends on has to bring that job along with it.
          const native = packaging || files.some((file) => nativePaths.test(file));
          appendFileSync(process.env.GITHUB_OUTPUT, `native=${native}\npackaging=${packaging}\n`);
          JS

  web:
    name: Web validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm check

  native:
    name: Native and engine validation
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/engine-target
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match build parallelism to the runner
        # Both builds were pinned to two jobs. Track the runner instead, capped
        # so a wider machine cannot run the linker out of memory.
        run: |
          cores="$(sysctl -n hw.ncpu)"
          jobs=$(( cores > 4 ? 4 : cores ))
          echo "Runner reports $cores cores; building with $jobs jobs"
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore Homebrew downloads
        id: brew-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-
      - name: Install native dependencies
        run: |
          brew update
          brew install cmake qt mpv pkgconf libtorrent-rasterbar boost dovi_tool mkvtoolnix
          pkg-config --print-errors --atleast-version=2.1.1 libtorrent-rasterbar
      # Homebrew's rust follows upstream releases, and the packaged engine's
      # runtime notices are reviewed for one release. rustup installs exactly
      # the release apps/stream-engine/rust-toolchain.toml pins.
      - name: Install the pinned Rust toolchain
        working-directory: apps/stream-engine
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Save Homebrew downloads
        if: steps.brew-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ steps.brew-cache.outputs.cache-primary-key }}

      - name: Identify the engine toolchain
        id: toolchain
        run: |
          kino_toolchain="$(cd apps/stream-engine && rustc --version)-$(pkg-config --modversion libtorrent-rasterbar)-$(brew list --versions boost)"
          echo "key=$(printf '%s' "$kino_toolchain" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo dependencies and build outputs
        id: engine-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/engine-target
            build/vendor/stream-server
            build/vendor/stream-server.stamp
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('apps/stream-engine/Cargo.lock', 'apps/stream-engine/engine.lock', 'apps/stream-engine/patches/**') }}
          restore-keys: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-
      - name: Reconstruct vendor patches and build the locked engine
        run: pnpm engine:build
      - name: Test the locked engine and embedded profile
        timeout-minutes: 5
        run: |
          (cd apps/stream-engine && CXXFLAGS="-I$(brew --prefix)/include" cargo test --locked --release)
          pnpm engine:check-profile
          pnpm engine:check-trackers
      - name: Save Cargo dependencies and build outputs
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/engine-target
            build/vendor/stream-server
            build/vendor/stream-server.stamp
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}

      - name: Compile and bundle the native shell
        run: |
          pnpm macos:build
          node scripts/check-version.mjs --app build/macos/Kino.app
      # The request-header, shutdown, and playback gates play these legal
      # fixtures, which ffmpeg generates rather than the repository storing.
      - name: Generate the playback fixtures
        timeout-minutes: 10
        run: node scripts/check-macos-playback.mjs --generate-only
      - name: Run native unit tests and startup probes
        timeout-minutes: 5
        run: |
          ctest --test-dir build/macos --output-on-failure --timeout 30
          pnpm macos:check-launch
          pnpm macos:check-engine
          pnpm macos:check-cache-clear
          pnpm macos:check-scale
          pnpm macos:check-focus
          pnpm macos:check-resume
          pnpm macos:check-intro
          pnpm macos:check-seasons
          pnpm macos:check-fullscreen
          pnpm macos:check-volume
          pnpm macos:check-audio
          pnpm macos:check-track-choices
          pnpm macos:check-web-console
          pnpm macos:check-navigation
          pnpm macos:check-interface-recovery
          pnpm macos:check-tls
          pnpm macos:check-engine-ui
          pnpm macos:check-engine-retry
          pnpm macos:check-request-headers
          pnpm macos:check-shutdown
          pnpm macos:check-addon-transports
      - name: Run the playback contract matrix
        timeout-minutes: 15
        # The hosted runner's virtual GPU draws video a capture reads back as black, so the pixel
        # cases run on a Mac with a real GPU; the SDR control still runs here and says so.
        env:
          KINO_PLAYBACK_PIXELS: optional
        run: pnpm macos:check-playback

      # Packaging is a release-artifact check, not a correctness check, and it
      # is the slowest step in this job. Pull requests run it only when the
      # bundle or its notices change; every push to main runs it.
      - name: Package and verify bundled dependency notices
        if: github.event_name == 'push' || needs.changes.outputs.packaging == 'true'
        # Bundling and re-signing every Qt framework takes 10 to 15 minutes on the hosted
        # runner, so a 15-minute limit failed runs that were only slow.
        timeout-minutes: 30
        run: pnpm macos:package --no-dmg

  linux:
    name: Linux shell build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    # The shell needs Qt 6.8 and libmpv 2.4 or newer, which Ubuntu ships from
    # 26.04. The container supplies them until the hosted image catches up.
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake \
            ninja-build pkg-config libmpv-dev qt6-base-dev qt6-declarative-dev qt6-webengine-dev \
            qt6-webchannel-dev libgl-dev xvfb xauth libgl1-mesa-dri fonts-dejavu-core \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtwebchannel qml6-module-qtwebengine
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile the shell
        run: |
          cmake -S apps/macos-shell -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build/linux --parallel "$(nproc)"
      - name: Run native unit tests
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/linux --output-on-failure --timeout 30
      # The same probes the Mac runs, against the Linux build on a virtual
      # display. Chromium's sandbox cannot start as root inside the container.
      # Interface recovery stays Mac-only for now: inside the container the
      # renderer crash DevTools requests never reaches the shell.
      - name: Run the interface probes
        timeout-minutes: 10
        env:
          KINO_APP_BINARY: ${{ github.workspace }}/build/linux/Kino
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" pnpm macos:check-launch
          xvfb-run -a -s "-screen 0 1920x1080x24" pnpm macos:check-navigation
          xvfb-run -a -s "-screen 0 1920x1080x24" pnpm macos:check-focus
          xvfb-run -a -s "-screen 0 1920x1080x24" pnpm macos:check-scale

  windows:
    name: Windows shell build
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # The Qt release the macOS and Linux builds use, so one notices review
      # covers all three.
      KINO_QT_VERSION: 6.11.2
      # SourceForge keeps every libmpv build; the GitHub releases rotate out.
      KINO_MPV_ARCHIVE: mpv-dev-x86_64-20260920-git-e76a35ec95.7z
      KINO_MPV_SHA256: 60f9102db46aea8cef9bfb4345ee6a106f34fdbd1df9587e38f0660688039341
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Restore Qt
        id: qt-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt
          key: qt-windows-${{ env.KINO_QT_VERSION }}-webengine-webchannel-positioning
      # Qt 6.11 lays its repository out per compiler, which aqtinstall reads
      # only since a change that is merged but not yet released. Its Python
      # 7z reader rejects a path in qtsvg's archive, and 7-Zip extracting
      # several archives at once races on the directories they share, so
      # 7-Zip extracts them one at a time.
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --quiet "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          New-Item -ItemType Directory -Force build | Out-Null
          "[aqt]`nconcurrency: 1" | Set-Content build/aqt.ini
          python -m aqt -c build/aqt.ini install-qt windows desktop $env:KINO_QT_VERSION win64_msvc2022_64 `
            --outputdir build/qt --modules qtwebengine qtwebchannel qtpositioning --external 7z
      - name: Save Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Put Qt on the path
        shell: pwsh
        run: |
          $qt = "$PWD/build/qt/$env:KINO_QT_VERSION/msvc2022_64"
          "$qt/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "CMAKE_PREFIX_PATH=$qt" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Fetch libmpv and make its MSVC import library
        shell: pwsh
        run: |
          $archive = "build/$env:KINO_MPV_ARCHIVE"
          New-Item -ItemType Directory -Force build/mpv | Out-Null
          # SourceForge answers some clients with a download page instead of
          # the file; curl follows its redirects to the mirror.
          curl.exe -fsSL -o $archive "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/$env:KINO_MPV_ARCHIVE"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:KINO_MPV_SHA256) { throw 'libmpv archive checksum mismatch' }
          7z x $archive -obuild/mpv -y | Out-Null
          # The archive carries a MinGW import library only. MSVC gets one of
          # its own, built from the DLL's export table.
          $names = dumpbin /nologo /exports build/mpv/libmpv-2.dll |
            Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($names.Count -lt 50) { throw 'libmpv exports could not be read' }
          @('LIBRARY libmpv-2', 'EXPORTS') + $names | Set-Content build/mpv/mpv.def
          lib /nologo /machine:x64 /def:build/mpv/mpv.def /out:build/mpv/mpv.lib
          "$PWD\build\mpv" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Compile the shell
        shell: pwsh
        run: |
          cmake -S apps/macos-shell -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBUILD_TESTING=ON "-DKINO_MPV_DIR=$PWD/build/mpv"
          cmake --build build/windows --parallel $env:NUMBER_OF_PROCESSORS
      - name: Run native unit tests
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/windows --output-on-failure --timeout 30
      # A portable folder: the shell, its interface, libmpv, the Qt libraries
      # and QML modules windeployqt finds it using, and the C++ runtime beside
      # them rather than as an installer to run first. Qt Quick draws with
      # OpenGL, so the Direct3D shader compilers stay out, and so does Qt's
      # software OpenGL: a 2016 Mesa whose LLVM release nothing records.
      - name: Package a portable build
        shell: pwsh
        run: |
          $out = 'build/windows-package/Kino'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/windows/Kino.exe $out
          Copy-Item -Recurse build/windows/ui "$out/ui"
          Copy-Item build/mpv/libmpv-2.dll $out
          windeployqt --release --qmldir apps/macos-shell/qml --no-translations `
            --skip-plugin-types qmltooling --no-system-d3d-compiler --no-system-dxc-compiler `
            --no-compiler-runtime --no-opengl-sw "$out/Kino.exe"
          # The folder is named for the toolset (VC143, VC145, ...).
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC*.CRT/*.dll" $out
          foreach ($required in 'Kino.exe', 'libmpv-2.dll', 'Qt6WebEngineCore.dll', 'QtWebEngineProcess.exe', 'vcruntime140.dll', 'msvcp140.dll', 'ui/index.html') {
            if (-not (Test-Path "$out/$required")) { throw "The portable build lacks $required" }
          }
          foreach ($unwanted in 'vc_redist.x64.exe', 'd3dcompiler_47.dll', 'dxcompiler.dll', 'dxil.dll', 'opengl32sw.dll', 'qmltooling') {
            if (Test-Path "$out/$unwanted") { throw "The portable build carries $unwanted" }
          }
          Compress-Archive -Path $out -DestinationPath build/windows-package/Kino-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kino-windows-x64
          path: build/windows-package/Kino-windows-x64.zip
          retention-days: 7

  validate:
    name: Validate
    needs: [changes, web, native, linux, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation job
        env:
          KINO_CHANGES_RESULT: ${{ needs.changes.result }}
          KINO_WEB_RESULT: ${{ needs.web.result }}
          KINO_NATIVE_RESULT: ${{ needs.native.result }}
          KINO_LINUX_RESULT: ${{ needs.linux.result }}
          KINO_WINDOWS_RESULT: ${{ needs.windows.result }}
          KINO_NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
        run: |
          test "$KINO_CHANGES_RESULT" = success
          test "$KINO_WEB_RESULT" = success
          if test "$KINO_NATIVE_REQUIRED" = true; then
            test "$KINO_NATIVE_RESULT" = success
            test "$KINO_LINUX_RESULT" = success
            test "$KINO_WINDOWS_RESULT" = success
          else
            test "$KINO_NATIVE_RESULT" = skipped
            test "$KINO_LINUX_RESULT" = skipped
            test "$KINO_WINDOWS_RESULT" = skipped
          fi
